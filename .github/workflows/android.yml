name: Build Fire TV app
on:
  push:
    paths: ['android/**', 'server/public/player/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Server address baked into the app (e.g. https://menu.example.com)'
        required: false
        default: 'http://192.168.4.26:3000'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PserverUrl="${{ github.event.inputs.server_url || 'http://192.168.4.26:3000' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: menu-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
