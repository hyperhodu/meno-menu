<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital Menu Player</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;cursor:none}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:opacity .6s}
.layer.on{opacity:1}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw;z-index:5;background:#000}
#msg.on{display:flex}#msg .big{font-size:14vw;letter-spacing:.08em;font-weight:700}#msg .sm{font-size:3vw;opacity:.7;margin-top:2vh}
#setup input{font-size:4vw;width:80vw;padding:1vw}#dot{display:none;position:absolute;right:10px;bottom:10px;width:14px;height:14px;border-radius:50%;background:#e03131;z-index:6;opacity:.85}
#dot.off{display:block}
</style></head><body>
<img id="a" class="layer"><img id="b" class="layer"><video id="va" class="layer" playsinline></video><video id="vb" class="layer" playsinline></video>
<div id="msg"></div><div id="dot"></div>
<script src="player.js"></script>
</body></html>
