plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.menoves.menuplayer'
    compileSdk 34
    defaultConfig {
        applicationId 'com.menoves.menuplayer'
        minSdk 22          // Fire OS 5.x and newer
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        // Optional: bake in the server address. Build with -PserverUrl=http://host:3000
        buildConfigField 'String', 'SERVER_URL', "\"${project.findProperty('serverUrl') ?: ''}\""
    }
    // One fixed key so every build can be installed over the previous one (keeps pairing and content).
    // This key is committed on purpose for easy sideloading; use a private key before any public release.
    signingConfigs {
        shared {
            storeFile file('menu-player.keystore')
            storePassword 'menuplayer'
            keyAlias 'menuplayer'
            keyPassword 'menuplayer'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

// The player UI lives in server/public/player and is bundled into the app unchanged.
tasks.register('copyPlayer', Copy) {
    from "$rootDir/../server/public/player"
    into "$projectDir/src/main/assets/player"
}
preBuild.dependsOn 'copyPlayer'

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core-ktx:1.13.1'
}
